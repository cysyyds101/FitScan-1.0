<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitScan 3D Model Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; text-align: center; }
    .models { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .model-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .model-card h3 { margin: 0 0 10px 0; color: #333; }
    .model-card p { color: #666; font-size: 14px; margin-bottom: 15px; }
    .btn {
      background: #4a90d9;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #3a7bc8; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 12px; color: #666; }
    .instructions {
      background: #e8f4fd;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .instructions h2 { margin-top: 0; color: #4a90d9; }
    .instructions ol { margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>FitScan 3D Model Generator</h1>
  
  <div class="instructions">
    <h2>使用说明</h2>
    <ol>
      <li>点击下方按钮下载模型文件</li>
      <li>将下载的文件保存到 <code>frontend/public/models/</code> 目录</li>
      <li>重启开发服务器</li>
    </ol>
  </div>
  
  <div class="models">
    <div class="model-card">
      <h3>人体模型</h3>
      <p>基础人形模型，用于虚拟换衣展示</p>
      <button class="btn" onclick="generateHuman()">下载 humanoid.glb</button>
      <div class="status" id="human-status"></div>
    </div>
    
    <div class="model-card">
      <h3>红色T恤</h3>
      <p>带有布料模拟效果的T恤</p>
      <button class="btn" onclick="generateTShirt()">下载 tshirt_red.glb</button>
      <div class="status" id="tshirt-status"></div>
    </div>
    
    <div class="model-card">
      <h3>蓝色卫衣</h3>
      <p>带有帽子和布料效果的卫衣</p>
      <button class="btn" onclick="generateHoodie()">下载 hoodie_blue.glb</button>
      <div class="status" id="hoodie-status"></div>
    </div>
    
    <div class="model-card">
      <h3>紫色连衣裙</h3>
      <p>带有飘逸裙摆的连衣裙</p>
      <button class="btn" onclick="generateDress()">下载 dress_purple.glb</button>
      <div class="status" id="dress-status"></div>
    </div>
  </div>
  
  <div style="text-align: center; margin-top: 30px;">
    <button class="btn" onclick="generateAll()" style="padding: 15px 30px;">
      一键生成所有模型
    </button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
    }
  }
  </script>
  
  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    
    const WHITE = new THREE.Color(1, 1, 1);
    const RED = new THREE.Color(1, 0, 0);
    
    function applyVertexColors(geometry, color) {
      const count = geometry.attributes.position.count;
      const colors = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }
    
    function createHumanoid() {
      const group = new THREE.Group();
      group.name = 'Humanoid';
      
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8c4a0, vertexColors: true });
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a90d9, vertexColors: true });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, vertexColors: true });
      
      // Head
      let geo = new THREE.SphereGeometry(0.12, 32, 32);
      applyVertexColors(geo, WHITE);
      let mesh = new THREE.Mesh(geo, skinMat);
      mesh.position.set(0, 1.5, 0);
      group.add(mesh);
      
      // Neck
      geo = new THREE.CylinderGeometry(0.05, 0.06, 0.1, 16);
      applyVertexColors(geo, WHITE);
      mesh = new THREE.Mesh(geo, skinMat);
      mesh.position.set(0, 1.35, 0);
      group.add(mesh);
      
      // Torso
      geo = new THREE.CapsuleGeometry(0.2, 0.4, 8, 16);
      applyVertexColors(geo, WHITE);
      mesh = new THREE.Mesh(geo, bodyMat);
      mesh.position.set(0, 1.0, 0);
      group.add(mesh);
      
      // Arms
      [-0.3, 0.3].forEach((x, i) => {
        geo = new THREE.CapsuleGeometry(0.05, 0.35, 8, 16);
        applyVertexColors(geo, WHITE);
        mesh = new THREE.Mesh(geo, bodyMat);
        mesh.position.set(x, 1.0, 0);
        mesh.rotation.z = i === 0 ? 0.3 : -0.3;
        group.add(mesh);
        
        // Forearm
        geo = new THREE.CapsuleGeometry(0.04, 0.3, 8, 16);
        applyVertexColors(geo, WHITE);
        const forearm = new THREE.Mesh(geo, skinMat);
        forearm.position.set(x * 1.5, 0.75, 0);
        group.add(forearm);
      });
      
      // Legs
      [-0.1, 0.1].forEach(x => {
        // Thigh
        geo = new THREE.CapsuleGeometry(0.08, 0.4, 8, 16);
        applyVertexColors(geo, WHITE);
        mesh = new THREE.Mesh(geo, pantsMat);
        mesh.position.set(x, 0.5, 0);
        group.add(mesh);
        
        // Shin
        geo = new THREE.CapsuleGeometry(0.06, 0.4, 8, 16);
        applyVertexColors(geo, WHITE);
        mesh = new THREE.Mesh(geo, pantsMat);
        mesh.position.set(x, 0.15, 0);
        group.add(mesh);
      });
      
      return group;
    }
    
    function createTShirt() {
      const group = new THREE.Group();
      group.name = 'TShirt';
      
      const mat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, vertexColors: true, side: THREE.DoubleSide });
      
      // Body
      let geo = new THREE.CapsuleGeometry(0.22, 0.35, 8, 16);
      applyVertexColors(geo, WHITE);
      let mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);
      
      // Cloth bottom (RED - simulation area)
      geo = new THREE.TorusGeometry(0.22, 0.03, 8, 32);
      applyVertexColors(geo, RED);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = -0.2;
      mesh.rotation.x = Math.PI / 2;
      group.add(mesh);
      
      // Sleeves
      [-0.28, 0.28].forEach((x, i) => {
        geo = new THREE.CylinderGeometry(0.06, 0.08, 0.15, 12, 4, true);
        applyVertexColors(geo, RED);
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 0.12, 0);
        mesh.rotation.z = i === 0 ? 0.5 : -0.5;
        group.add(mesh);
      });
      
      return group;
    }
    
    function createHoodie() {
      const group = new THREE.Group();
      group.name = 'Hoodie';
      
      const mat = new THREE.MeshStandardMaterial({ color: 0x3498db, vertexColors: true, side: THREE.DoubleSide });
      
      // Body
      let geo = new THREE.CapsuleGeometry(0.24, 0.4, 8, 16);
      applyVertexColors(geo, WHITE);
      let mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);
      
      // Hood (RED - flowing)
      geo = new THREE.SphereGeometry(0.14, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6);
      applyVertexColors(geo, RED);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = 0.32;
      mesh.scale.set(1, 0.7, 1);
      group.add(mesh);
      
      // Bottom cloth
      geo = new THREE.TorusGeometry(0.26, 0.03, 8, 32);
      applyVertexColors(geo, RED);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = -0.22;
      mesh.rotation.x = Math.PI / 2;
      group.add(mesh);
      
      return group;
    }
    
    function createDress() {
      const group = new THREE.Group();
      group.name = 'Dress';
      
      const mat = new THREE.MeshStandardMaterial({ color: 0x9b59b6, vertexColors: true, side: THREE.DoubleSide });
      
      // Top
      let geo = new THREE.CylinderGeometry(0.12, 0.18, 0.25, 16);
      applyVertexColors(geo, WHITE);
      let mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = 0.1;
      group.add(mesh);
      
      // Skirt (full RED - flowing)
      geo = new THREE.CylinderGeometry(0.18, 0.45, 0.6, 24, 8, true);
      applyVertexColors(geo, RED);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = -0.17;
      group.add(mesh);
      
      return group;
    }
    
    async function exportAndDownload(model, filename) {
      return new Promise((resolve) => {
        const exporter = new GLTFExporter();
        exporter.parse(model, (result) => {
          const blob = new Blob([result], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
          resolve();
        }, { binary: true });
      });
    }
    
    window.generateHuman = async () => {
      const status = document.getElementById('human-status');
      status.textContent = 'Generating...';
      await exportAndDownload(createHumanoid(), 'humanoid.glb');
      status.textContent = 'Downloaded! Save to /models/human/default.glb';
    };
    
    window.generateTShirt = async () => {
      const status = document.getElementById('tshirt-status');
      status.textContent = 'Generating...';
      await exportAndDownload(createTShirt(), 'tshirt_red.glb');
      status.textContent = 'Downloaded! Save to /models/clothing/';
    };
    
    window.generateHoodie = async () => {
      const status = document.getElementById('hoodie-status');
      status.textContent = 'Generating...';
      await exportAndDownload(createHoodie(), 'hoodie_blue.glb');
      status.textContent = 'Downloaded! Save to /models/clothing/';
    };
    
    window.generateDress = async () => {
      const status = document.getElementById('dress-status');
      status.textContent = 'Generating...';
      await exportAndDownload(createDress(), 'dress_purple.glb');
      status.textContent = 'Downloaded! Save to /models/clothing/';
    };
    
    window.generateAll = async () => {
      await generateHuman();
      await generateTShirt();
      await generateHoodie();
      await generateDress();
      alert('All models generated! Please save them to the correct directories.');
    };
  </script>
</body>
</html>
