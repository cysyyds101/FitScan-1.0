<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitScan 模块架构图</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e2e8f0;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 60px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .diagram-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        
        .diagram-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(148, 163, 184, 0.1);
        }
        
        .diagram-title.measurement {
            color: #3B82F6;
        }
        
        .diagram-title.tryon {
            color: #8B5CF6;
        }
        
        svg {
            display: block;
            overflow: visible;
        }
        
        .node-group {
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        
        .node-group:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }
        
        .footer-note {
            text-align: center;
            margin-top: 60px;
            padding: 20px 40px;
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.1), rgba(251, 191, 36, 0.05));
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 12px;
            color: #fbbf24;
            font-size: 0.95rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .footer-note svg {
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h1>FitScan 智能模块架构</h1>
    
    <div class="container">
        <!-- Diagram 1: AI Body Measurement Module -->
        <div class="diagram-card">
            <h2 class="diagram-title measurement">AI 身体测量模块</h2>
            <svg width="480" height="580" viewBox="0 0 480 580">
                <defs>
                    <!-- Gradients -->
                    <linearGradient id="inputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#6B7280"/>
                        <stop offset="100%" style="stop-color:#4B5563"/>
                    </linearGradient>
                    
                    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#3B82F6"/>
                        <stop offset="100%" style="stop-color:#1D4ED8"/>
                    </linearGradient>
                    
                    <linearGradient id="techGradientAlt" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#60A5FA"/>
                        <stop offset="100%" style="stop-color:#3B82F6"/>
                    </linearGradient>
                    
                    <linearGradient id="outputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#10B981"/>
                        <stop offset="100%" style="stop-color:#059669"/>
                    </linearGradient>
                    
                    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#60A5FA"/>
                        <stop offset="100%" style="stop-color:#3B82F6"/>
                    </linearGradient>
                    
                    <!-- Drop shadow filter -->
                    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
                    </filter>
                    
                    <!-- Glow filter -->
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- === Stage 1: User Image (Input) === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <!-- Main box -->
                    <rect x="140" y="30" width="200" height="70" rx="12" fill="url(#inputGradient)" stroke="#9CA3AF" stroke-width="1"/>
                    <!-- Icon circle -->
                    <circle cx="175" cy="65" r="18" fill="rgba(255,255,255,0.15)"/>
                    <text x="175" y="70" text-anchor="middle" fill="#E5E7EB" font-size="14">📷</text>
                    <!-- Label -->
                    <text x="240" y="58" text-anchor="middle" fill="#F3F4F6" font-size="16" font-weight="500">用户图片</text>
                    <text x="240" y="78" text-anchor="middle" fill="#D1D5DB" font-size="11">User Image</text>
                </g>
                
                <!-- Arrow 1 -->
                <g filter="url(#glow)">
                    <path d="M240 100 L240 135" stroke="url(#arrowGradient)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
                </g>
                <polygon points="240,145 234,130 246,130" fill="#3B82F6"/>
                
                <!-- === Stage 2: Image Preprocessor === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="100" y="150" width="280" height="90" rx="14" fill="url(#techGradient)" stroke="#60A5FA" stroke-width="1"/>
                    
                    <!-- Header -->
                    <text x="240" y="178" text-anchor="middle" fill="#DBEAFE" font-size="14" font-weight="600">图像预处理</text>
                    
                    <!-- Sub-nodes -->
                    <rect x="120" y="195" width="100" height="32" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
                    <text x="170" y="215" text-anchor="middle" fill="#E0E7FF" font-size="12">对比度增强</text>
                    <text x="170" y="228" text-anchor="middle" fill="#A5B4FC" font-size="10">enhanceContrast</text>
                    
                    <rect x="260" y="195" width="100" height="32" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
                    <text x="310" y="215" text-anchor="middle" fill="#E0E7FF" font-size="12">图像锐化</text>
                    <text x="310" y="228" text-anchor="middle" fill="#A5B4FC" font-size="10">sharpen</text>
                </g>
                
                <!-- Arrow 2 -->
                <g filter="url(#glow)">
                    <path d="M240 240 L240 275" stroke="url(#arrowGradient)" stroke-width="3" fill="none"/>
                </g>
                <polygon points="240,285 234,270 246,270" fill="#3B82F6"/>
                
                <!-- === Stage 3: MoveNet Pose Detection === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="80" y="290" width="320" height="100" rx="14" fill="url(#techGradientAlt)" stroke="#93C5FD" stroke-width="1"/>
                    
                    <text x="240" y="320" text-anchor="middle" fill="#DBEAFE" font-size="15" font-weight="600">MoveNet 姿态检测</text>
                    <text x="240" y="338" text-anchor="middle" fill="#A5B4FC" font-size="11">MoveNet Pose Detection</text>
                    
                    <!-- Keypoints visualization -->
                    <g transform="translate(240, 365)">
                        <!-- Skeleton representation -->
                        <circle cx="-25" cy="-10" r="5" fill="#93C5FD" opacity="0.9"/>
                        <circle cx="25" cy="-10" r="5" fill="#93C5FD" opacity="0.9"/>
                        <circle cx="0" cy="5" r="6" fill="#BFDBFE" opacity="0.9"/>
                        <circle cx="-15" cy="20" r="5" fill="#93C5FD" opacity="0.9"/>
                        <circle cx="15" cy="20" r="5" fill="#93C5FD" opacity="0.9"/>
                        <circle cx="-30" cy="35" r="5" fill="#93C5FD" opacity="0.9"/>
                        <circle cx="30" cy="35" r="5" fill="#93C5FD" opacity="0.9"/>
                    </g>
                    
                    <!-- Badge -->
                    <rect x="320" y="305" width="65" height="22" rx="11" fill="rgba(16,185,129,0.2)" stroke="#10B981"/>
                    <text x="352" y="320" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">17关键点</text>
                </g>
                
                <!-- Arrow 3 -->
                <g filter="url(#glow)">
                    <path d="M240 390 L240 425" stroke="url(#arrowGradient)" stroke-width="3" fill="none"/>
                </g>
                <polygon points="240,435 234,420 246,420" fill="#3B82F6"/>
                
                <!-- === Stage 4: Body Measurements === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="120" y="440" width="240" height="70" rx="12" fill="url(#outputGradient)" stroke="#34D399" stroke-width="1"/>
                    
                    <circle cx="160" cy="475" r="16" fill="rgba(255,255,255,0.15)"/>
                    <text x="160" y="480" text-anchor="middle" fill="#ECFDF5" font-size="14">📏</text>
                    
                    <text x="240" y="465" text-anchor="middle" fill="#D1FAE5" font-size="14" font-weight="600">身体测量</text>
                    <text x="240" y="483" text-anchor="middle" fill="#A7F3D0" font-size="10">Height | Chest | Waist | Hip</text>
                </g>
                
                <!-- Arrow 4 -->
                <g filter="url(#glow)">
                    <path d="M240 510 L240 545" stroke="#10B981" stroke-width="3" fill="none"/>
                </g>
                <polygon points="240,555 234,540 246,540" fill="#10B981"/>
                
                <!-- === Stage 5: Size Recommendation === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="140" y="560" width="200" height="60" rx="12" fill="linear-gradient(135deg, #059669, #047857)" stroke="#34D399" stroke-width="1"/>
                    <rect x="140" y="560" width="200" height="60" rx="12" fill="url(#outputGradient)"/>
                    
                    <text x="240" y="585" text-anchor="middle" fill="#ECFDF5" font-size="14" font-weight="600">尺码推荐</text>
                    <text x="240" y="602" text-anchor="middle" fill="#A7F3D0" font-size="10">S / M / L / XL / XXL</text>
                </g>
                
                <!-- Decorative elements -->
                <circle cx="50" cy="65" r="3" fill="#3B82F6" opacity="0.5"/>
                <circle cx="430" cy="520" r="4" fill="#10B981" opacity="0.4"/>
            </svg>
        </div>
        
        <!-- Diagram 2: 3D Virtual Try-On Module -->
        <div class="diagram-card">
            <h2 class="diagram-title tryon">3D 虚拟试穿模块</h2>
            <svg width="520" height="580" viewBox="0 0 520 580">
                <defs>
                    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#8B5CF6"/>
                        <stop offset="100%" style="stop-color:#6D28D9"/>
                    </linearGradient>
                    
                    <linearGradient id="purpleGradientAlt" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#A78BFA"/>
                        <stop offset="100%" style="stop-color:#8B5CF6"/>
                    </linearGradient>
                    
                    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#F59E0B"/>
                        <stop offset="100%" style="stop-color:#D97706"/>
                    </linearGradient>
                    
                    <linearGradient id="orangeGradientAlt" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FBBF24"/>
                        <stop offset="100%" style="stop-color:#F59E0B"/>
                    </linearGradient>
                    
                    <linearGradient id="presetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#EC4899"/>
                        <stop offset="100%" style="stop-color:#BE185D"/>
                    </linearGradient>
                    
                    <linearGradient id="pathAGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.3"/>
                        <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.3"/>
                    </linearGradient>
                    
                    <linearGradient id="pathBGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.3"/>
                        <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.3"/>
                    </linearGradient>
                    
                    <filter id="glowPurple">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    
                    <filter id="glowOrange">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- === PATH A: Preset Selection === -->
                <!-- Path A Label -->
                <text x="120" y="45" text-anchor="middle" fill="#F472B6" font-size="11" font-weight="600" letter-spacing="1">路径 A</text>
                
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="40" y="55" width="160" height="65" rx="12" fill="url(#presetGradient)" stroke="#F9A8D4" stroke-width="1"/>
                    
                    <circle cx="75" cy="87" r="16" fill="rgba(255,255,255,0.15)"/>
                    <text x="75" y="92" text-anchor="middle" fill="#FCE7F3" font-size="14">👕</text>
                    
                    <text x="145" y="82" text-anchor="middle" fill="#FCE7F3" font-size="13" font-weight="500">选择预设服装</text>
                    <text x="145" y="98" text-anchor="middle" fill="#FBCFE8" font-size="10">Preset Selection</text>
                </g>
                
                <!-- Arrow A1 -->
                <g filter="url(#glowPurple)">
                    <path d="M120 120 L120 155" stroke="#8B5CF6" stroke-width="3" fill="none"/>
                </g>
                <polygon points="120,165 114,150 126,150" fill="#8B5CF6"/>
                
                <!-- === PATH A: GeometricClothing === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="40" y="170" width="160" height="65" rx="12" fill="url(#purpleGradient)" stroke="#A78BFA" stroke-width="1"/>
                    
                    <circle cx="75" cy="202" r="16" fill="rgba(255,255,255,0.15)"/>
                    <text x="75" y="207" text-anchor="middle" fill="#EDE9FE" font-size="14">📐</text>
                    
                    <text x="145" y="198" text-anchor="middle" fill="#EDE9FE" font-size="13" font-weight="500">几何服装模型</text>
                    <text x="145" y="214" text-anchor="middle" fill="#C4B5FD" font-size="10">GeometricClothing</text>
                </g>
                
                <!-- === PATH B: Image Upload === -->
                <!-- Path B Label -->
                <text x="400" y="45" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="600" letter-spacing="1">路径 B</text>
                
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="320" y="55" width="160" height="65" rx="12" fill="url(#orangeGradient)" stroke="#FCD34D" stroke-width="1"/>
                    
                    <circle cx="355" cy="87" r="16" fill="rgba(255,255,255,0.15)"/>
                    <text x="355" y="92" text-anchor="middle" fill="#FEF3C7" font-size="14">🖼️</text>
                    
                    <text x="425" y="82" text-anchor="middle" fill="#FEF3C7" font-size="13" font-weight="500">上传服装图片</text>
                    <text x="425" y="98" text-anchor="middle" fill="#FDE68A" font-size="10">Image Upload</text>
                </g>
                
                <!-- Arrow B1 -->
                <g filter="url(#glowOrange)">
                    <path d="M400 120 L400 155" stroke="#F59E0B" stroke-width="3" fill="none"/>
                </g>
                <polygon points="400,165 394,150 406,150" fill="#F59E0B"/>
                
                <!-- === PATH B: AI 3D Generation === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="290" y="170" width="220" height="80" rx="14" fill="url(#orangeGradientAlt)" stroke="#FCD34D" stroke-width="1"/>
                    
                    <text x="400" y="198" text-anchor="middle" fill="#FFFBEB" font-size="14" font-weight="600">AI 3D 生成</text>
                    <text x="400" y="216" text-anchor="middle" fill="#FEF3C7" font-size="11">AI 3D Generation</text>
                    
                    <!-- AI badge -->
                    <rect x="305" y="225" width="55" height="18" rx="9" fill="rgba(139,92,246,0.3)" stroke="#8B5CF6"/>
                    <text x="332" y="237" text-anchor="middle" fill="#C4B5FD" font-size="9">Tripo AI</text>
                    
                    <rect x="370" y="225" width="70" height="18" rx="9" fill="rgba(16,185,129,0.2)" stroke="#10B981"/>
                    <text x="405" y="237" text-anchor="middle" fill="#6EE7B7" font-size="9">Local GPU</text>
                </g>
                
                <!-- Arrow B2 -->
                <g filter="url(#glowOrange)">
                    <path d="M400 250 L400 285" stroke="#F59E0B" stroke-width="3" fill="none"/>
                </g>
                <polygon points="400,295 394,280 406,280" fill="#F59E0B"/>
                
                <!-- === PATH B: GLB Model === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="320" y="290" width="160" height="65" rx="12" fill="url(#orangeGradient)" stroke="#FCD34D" stroke-width="1"/>
                    
                    <circle cx="355" cy="322" r="16" fill="rgba(255,255,255,0.15)"/>
                    <text x="355" y="327" text-anchor="middle" fill="#FEF3C7" font-size="14">🎲</text>
                    
                    <text x="425" y="318" text-anchor="middle" fill="#FEF3C7" font-size="13" font-weight="500">GLB 模型</text>
                    <text x="425" y="334" text-anchor="middle" fill="#FDE68A" font-size="10">GLB Model Output</text>
                </g>
                
                <!-- === Converging Point === -->
                <!-- Connecting lines from both paths to converge -->
                <path d="M120 235 Q120 300 200 320" stroke="#8B5CF6" stroke-width="3" fill="none" stroke-dasharray="5,3" opacity="0.7"/>
                <path d="M400 355 Q400 380 320 400" stroke="#F59E0B" stroke-width="3" fill="none" stroke-dasharray="5,3" opacity="0.7"/>
                
                <!-- Converge Arrow to Three.js -->
                <g filter="url(#glowPurple)">
                    <path d="M260 320 L260 355" stroke="#8B5CF6" stroke-width="3" fill="none"/>
                </g>
                <polygon points="260,365 254,350 266,350" fill="#8B5CF6"/>
                
                <!-- === Three.js Renderer === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="130" y="370" width="260" height="80" rx="14" fill="url(#purpleGradientAlt)" stroke="#C4B5FD" stroke-width="1"/>
                    
                    <text x="260" y="400" text-anchor="middle" fill="#F5F3FF" font-size="15" font-weight="600">Three.js 渲染引擎</text>
                    <text x="260" y="420" text-anchor="middle" fill="#DDD6FE" font-size="11">Three.js Renderer</text>
                    
                    <!-- WebGL badge -->
                    <rect x="155" y="428" width="65" height="18" rx="9" fill="rgba(34,197,94,0.2)" stroke="#22C55E"/>
                    <text x="187" y="440" text-anchor="middle" fill="#86EFAC" font-size="9">WebGL</text>
                </g>
                
                <!-- Arrow to Final -->
                <g filter="url(#glowPurple)">
                    <path d="M260 450 L260 485" stroke="#8B5CF6" stroke-width="3" fill="none"/>
                </g>
                <polygon points="260,495 254,480 266,480" fill="#8B5CF6"/>
                
                <!-- === Virtual Try-On Display === -->
                <g class="node-group" filter="url(#dropShadow)">
                    <rect x="150" y="500" width="220" height="65" rx="12" fill="linear-gradient(135deg, #7C3AED, #4C1D95)" stroke="#A78BFA" stroke-width="2"/>
                    
                    <circle cx="195" cy="532" r="18" fill="rgba(255,255,255,0.2)"/>
                    <text x="195" y="537" text-anchor="middle" fill="#F5F3FF" font-size="16">🥽</text>
                    
                    <text x="290" y="525" text-anchor="middle" fill="#F5F3FF" font-size="14" font-weight="600">虚拟试穿展示</text>
                    <text x="290" y="545" text-anchor="middle" fill="#DDD6FE" font-size="10">Virtual Try-On Display</text>
                </g>
                
                <!-- Decorative elements -->
                <circle cx="40" cy="300" r="4" fill="#EC4899" opacity="0.4"/>
                <circle cx="480" cy="200" r="4" fill="#F59E0B" opacity="0.4"/>
                <circle cx="30" cy="500" r="3" fill="#8B5CF6" opacity="0.3"/>
                
                <!-- Legend -->
                <g transform="translate(30, 530)">
                    <rect width="80" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
                    <rect x="10" y="10" width="12" height="8" rx="2" fill="#EC4899"/>
                    <text x="28" y="17" fill="#F9A8D4" font-size="8">路径 A</text>
                    <rect x="10" y="25" width="12" height="8" rx="2" fill="#F59E0B"/>
                    <text x="28" y="32" fill="#FCD34D" font-size="8">路径 B</text>
                </g>
            </svg>
        </div>
    </div>
    
    <!-- Footer Note -->
    <div class="footer-note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        本地 GPU 服务器可替代 Tripo AI 云端服务
    </div>
</body>
</html>
