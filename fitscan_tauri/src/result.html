<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>识别结果</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="title-bar" id="title-bar">
    <div class="title">FitScan Offline</div>
    <div class="window-controls">
      <button class="btn" id="minimize">—</button>
      <button class="btn" id="close">✕</button>
    </div>
  </div>

  <div class="content">
    <h2>识别结果</h2>
    <pre id="result"></pre>

    <button id="saveBtn">保存</button>
    <button id="shareBtn">分享</button>
    <button id="retryBtn">重新测量</button>
  </div>

  <script src="result.js"></script>
</body>
</html>
